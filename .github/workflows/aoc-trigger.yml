# STACKIT Functions only supports HTTP triggers and scales to zero, so something
# external must call the function every half hour. The function itself decides
# (from the clock) whether it is a leaderboard or a latest-stars slot, and skips
# runs outside its active window, so a late or missed tick is harmless.
name: aoc-trigger
on:
  schedule:
    # every 30 min, December only; hours are UTC (08-21 Amsterdam = 07-20 UTC in
    # winter) with a margin. The function enforces the exact window.
    - cron: "*/30 6-20 * 12 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Force leaderboard or stars (empty = automatic)"
        required: false
        default: ""
      lookback:
        description: "Stars lookback WITH a unit, e.g. 8760h (a bare number like 8760 is rejected)"
        required: false
        default: ""
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call function
        env:
          FUNCTION_URL: ${{ secrets.AOC_FUNCTION_URL }}   # https://<id>.functions.onstackit.cloud
          TRIGGER_TOKEN: ${{ secrets.AOC_TRIGGER_TOKEN }}
          MODE: ${{ github.event.inputs.mode }}
          LOOKBACK: ${{ github.event.inputs.lookback }}
        run: |
          # Be strict: a redirect (e.g. http:// instead of https://) or an empty reply must not look like success.
          case "$FUNCTION_URL" in
            https://*) ;;
            *) echo "::error::secret AOC_FUNCTION_URL must be set and start with https:// (e.g. https://<id>.functions.onstackit.cloud)"; exit 1;;
          esac
          FUNCTION_URL="${FUNCTION_URL%/}"
          if [ -n "$LOOKBACK" ] && ! [[ "$LOOKBACK" =~ ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$ ]]; then
            echo "::error::lookback needs a unit, e.g. 8760h (got '$LOOKBACK')"; exit 1
          fi
          query=()
          [ -z "$MODE" ] || query+=(--data-urlencode "mode=${MODE}")
          [ -z "$LOOKBACK" ] || query+=(--data-urlencode "lookback=${LOOKBACK}")
          for attempt in 1 2 3; do
            status=$(curl --silent --show-error --max-time 90 -o response.txt -w '%{http_code}' \
              -X POST -H "Authorization: Bearer ${TRIGGER_TOKEN}" \
              -G "${FUNCTION_URL}/run" "${query[@]}" || echo 000)
            echo "attempt $attempt: HTTP $status"
            echo "--- response body ---"; cat response.txt 2>/dev/null; echo; echo "---------------------"
            # retry only cold-start style failures (5xx / no answer)
            case "$status" in 5*|000) [ "$attempt" -lt 3 ] && { sleep 15; continue; } ;; esac
            break
          done
          case "$status" in
            2*) ;;
            3*) echo "::error::HTTP $status (redirect): check that AOC_FUNCTION_URL is the exact https:// URL of the function"; exit 1;;
            401) echo "::error::HTTP 401: AOC_TRIGGER_TOKEN does not match the function's TRIGGER_TOKEN (redeploy after changing it)"; exit 1;;
            *) echo "::error::function answered HTTP $status"; exit 1;;
          esac
          [ -s response.txt ] || { echo "::error::empty response; the request did not reach the app"; exit 1; }
