# Build the container, push it to the registry and deploy it as a new revision of
# the STACKIT Function. See aoc-leaderboard-go/README.md ("CI/CD") for the one-time
# setup (bootstrap manifests, pull secret, service account) and required secrets.
name: deploy-stackit
on:
  push:
    branches: [master]
    paths: ["aoc-leaderboard-go/**", ".github/workflows/deploy-stackit.yml"]
  workflow_dispatch:
    inputs:
      year:
        description: "Advent of Code year to track (empty = repo variable AOC_YEAR, else the current year)"
        required: false
        default: ""
      always_active:
        description: "Post outside December / opening hours (for testing, e.g. with year 2025)"
        type: boolean
        default: false

concurrency:
  group: deploy-stackit
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Repository *variables* (Settings > Secrets and variables > Actions > Variables)
  REGISTRY: ${{ vars.STACKIT_REGISTRY }}          # e.g. registry.onstackit.cloud
  IMAGE: ${{ vars.STACKIT_IMAGE }}                # full image path without tag
  FUNC_PROJECT_ID: ${{ vars.STACKIT_PROJECT_ID }}
  FUNC_NAME: ${{ vars.STACKIT_FUNCTION_NAME || 'aoc-leaderboard' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aoc-leaderboard-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: aoc-leaderboard-go/go.mod
      - run: go vet ./... && go test ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production   # optional: add required reviewers in the repo settings
    defaults:
      run:
        working-directory: aoc-leaderboard-go
    steps:
      - uses: actions/checkout@v4

      # Fail fast with ONE message listing everything that is not configured yet
      # (names only, never values).
      - name: Check configuration
        env:
          STACKIT_REGISTRY: ${{ vars.STACKIT_REGISTRY }}
          STACKIT_IMAGE: ${{ vars.STACKIT_IMAGE }}
          STACKIT_PROJECT_ID: ${{ vars.STACKIT_PROJECT_ID }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          STACKIT_SERVICE_ACCOUNT_KEY: ${{ secrets.STACKIT_SERVICE_ACCOUNT_KEY }}
          AOC_LEADERBOARD_ID: ${{ secrets.AOC_LEADERBOARD_ID }}
          AOC_SESSION: ${{ secrets.AOC_SESSION }}
          AOC_TRIGGER_TOKEN: ${{ secrets.AOC_TRIGGER_TOKEN }}
        run: |
          missing=""
          for v in STACKIT_REGISTRY STACKIT_IMAGE STACKIT_PROJECT_ID; do
            [ -n "${!v}" ] || missing="$missing%0A  - variable $v"
          done
          for v in REGISTRY_USERNAME REGISTRY_PASSWORD STACKIT_SERVICE_ACCOUNT_KEY AOC_LEADERBOARD_ID AOC_SESSION AOC_TRIGGER_TOKEN; do
            [ -n "${!v}" ] || missing="$missing%0A  - secret $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Deploy not configured::Missing repository settings (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi
          case "$STACKIT_IMAGE" in
            "$STACKIT_REGISTRY"/*) ;;
            *) echo "::error::STACKIT_IMAGE ('$STACKIT_IMAGE') must start with STACKIT_REGISTRY ('$STACKIT_REGISTRY')/"; exit 1;;
          esac

      - name: Log in to the container registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Build and push image (linux/amd64)
        run: |
          TAG="${GITHUB_SHA::12}"
          docker build --platform linux/amd64 -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          echo "IMAGE_REF=$IMAGE:$TAG" >> "$GITHUB_ENV"

      # Install script as documented at
      # https://docs.functions.onstackit.cloud/ (Automate function deployments)
      - name: Install the STACKIT Functions CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/stackitcloud/stackit-functions-cli/refs/heads/main/install-sfn.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Log in to STACKIT Functions
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.STACKIT_SERVICE_ACCOUNT_KEY }}
        run: |
          umask 077
          printf '%s' "$SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/sa-key.json"
          sfn auth login --no-interactive --service-account-key-path "$RUNNER_TEMP/sa-key.json"
          rm -f "$RUNNER_TEMP/sa-key.json"

      - name: Write runtime environment file
        env:
          AOC_LEADERBOARD_ID: ${{ secrets.AOC_LEADERBOARD_ID }}
          AOC_SESSION: ${{ secrets.AOC_SESSION }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VESTABOARD_API_KEY: ${{ secrets.VESTABOARD_API_KEY }}
          TRIGGER_TOKEN: ${{ secrets.AOC_TRIGGER_TOKEN }}
          AOC_YEAR: ${{ github.event.inputs.year || vars.AOC_YEAR }}
          ALWAYS_ACTIVE: ${{ github.event.inputs.always_active == 'true' && 'true' || vars.ALWAYS_ACTIVE }}
        run: |
          umask 077
          for v in AOC_LEADERBOARD_ID AOC_SESSION TRIGGER_TOKEN; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is not set"; exit 1; }
          done
          {
            echo "AOC_LEADERBOARD_ID=$AOC_LEADERBOARD_ID"
            echo "AOC_SESSION=$AOC_SESSION"
            echo "SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL"
            echo "VESTABOARD_API_KEY=$VESTABOARD_API_KEY"
            echo "TRIGGER_TOKEN=$TRIGGER_TOKEN"
            # optional settings: only written when set
            [ -z "$AOC_YEAR" ] || echo "AOC_YEAR=$AOC_YEAR"
            [ -z "$ALWAYS_ACTIVE" ] || echo "ALWAYS_ACTIVE=$ALWAYS_ACTIVE"
          } > .deploy.env

      - name: Deploy new revision
        env:
          # Registry credentials the CLI uses to resolve the pushed image.
          FUNC_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          FUNC_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          sfn function deploy \
            --no-interactive --no-progress \
            --function-name "$FUNC_NAME" \
            --build=false --push=false \
            --image "$IMAGE_REF" \
            --env-file .deploy.env

      - name: Remove env file
        if: always()
        run: rm -f .deploy.env
