# Build the container, push it to the registry and deploy it as a new revision of
# the STACKIT Function. See aoc-leaderboard-go/README.md ("CI/CD") for the one-time
# setup (bootstrap manifests, pull secret, service account) and required secrets.
name: deploy-stackit
on:
  push:
    branches: [master]
    # Only changes that alter the built container redeploy automatically. README/docs, tests,
    # workflow and manifest edits do not; use "Run workflow" for those.
    paths:
      - "aoc-leaderboard-go/**/*.go"
      - "!aoc-leaderboard-go/**/*_test.go"
      - "aoc-leaderboard-go/go.mod"
      - "aoc-leaderboard-go/go.sum"
      - "aoc-leaderboard-go/Dockerfile"
  workflow_dispatch:
    inputs:
      year:
        description: "Advent of Code year to track (empty = repo variable AOC_YEAR, else the current year)"
        required: false
        default: ""
      always_active:
        description: "Ignore the year/event-day check (for testing outside December, e.g. with year 2025); opening hours still apply"
        type: boolean
        default: false

concurrency:
  group: deploy-stackit
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Repository *variables* (Settings > Secrets and variables > Actions > Variables)
  REGISTRY: ${{ vars.STACKIT_REGISTRY }}          # e.g. registry.onstackit.cloud
  IMAGE: ${{ vars.STACKIT_IMAGE }}                # full image path without tag
  FUNC_PROJECT_ID: ${{ vars.STACKIT_PROJECT_ID }}
  FUNC_NAME: ${{ vars.STACKIT_FUNCTION_NAME || 'aoc-leaderboard' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aoc-leaderboard-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: aoc-leaderboard-go/go.mod
      - run: go vet ./... && go test ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production   # optional: add required reviewers in the repo settings
    defaults:
      run:
        working-directory: aoc-leaderboard-go
    steps:
      - uses: actions/checkout@v4

      # Fail fast with ONE message listing everything that is not configured yet
      # (names only, never values).
      - name: Check configuration
        env:
          STACKIT_REGISTRY: ${{ vars.STACKIT_REGISTRY }}
          STACKIT_IMAGE: ${{ vars.STACKIT_IMAGE }}
          STACKIT_PROJECT_ID: ${{ vars.STACKIT_PROJECT_ID }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          STACKIT_SERVICE_ACCOUNT_KEY: ${{ secrets.STACKIT_SERVICE_ACCOUNT_KEY }}
          AOC_LEADERBOARD_ID: ${{ vars.AOC_LEADERBOARD_ID || secrets.AOC_LEADERBOARD_ID }}  # variable or secret
          AOC_SESSION: ${{ secrets.AOC_SESSION }}
          AOC_TRIGGER_TOKEN: ${{ secrets.AOC_TRIGGER_TOKEN }}
        run: |
          missing=""
          for v in STACKIT_REGISTRY STACKIT_IMAGE STACKIT_PROJECT_ID; do
            [ -n "${!v}" ] || missing="$missing%0A  - variable $v"
          done
          for v in REGISTRY_USERNAME REGISTRY_PASSWORD STACKIT_SERVICE_ACCOUNT_KEY AOC_LEADERBOARD_ID AOC_SESSION AOC_TRIGGER_TOKEN; do
            [ -n "${!v}" ] || missing="$missing%0A  - secret $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Deploy not configured::Missing repository settings (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi
          case "$STACKIT_IMAGE" in
            "$STACKIT_REGISTRY"/*) ;;
            *) echo "::error::STACKIT_IMAGE ('$STACKIT_IMAGE') must start with STACKIT_REGISTRY ('$STACKIT_REGISTRY')/"; exit 1;;
          esac

      - name: Log in to the container registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Build and push image (linux/amd64)
        run: |
          # STACKIT Functions only accepts SemVer tags (or latest + digest), so a commit SHA won't do.
          # The run number gives a unique, increasing version; the commit is kept as an image label.
          TAG="1.0.${GITHUB_RUN_NUMBER}"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          echo "IMAGE_REF=$IMAGE:$TAG" >> "$GITHUB_ENV"

      # Install script as documented at
      # https://docs.functions.onstackit.cloud/ (Automate function deployments)
      - name: Install the STACKIT Functions CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/stackitcloud/stackit-functions-cli/refs/heads/main/install-sfn.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Log in to STACKIT Functions
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.STACKIT_SERVICE_ACCOUNT_KEY }}
        run: |
          umask 077
          printf '%s' "$SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/sa-key.json"
          sfn auth login --no-interactive --service-account-key-path "$RUNNER_TEMP/sa-key.json"
          rm -f "$RUNNER_TEMP/sa-key.json"

      - name: Deploy new revision
        env:
          # Registry credentials the CLI uses to resolve the pushed image.
          FUNC_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          FUNC_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          # The image is already built and pushed by the steps above. In sfn, --build/--push
          # are bare flags (the docs' `--build=false` is rejected: "unexpected value 'false'"),
          # so switch them off through their documented environment variables instead.
          FUNC_BUILD: "false"
          FUNC_PUSH: "false"
          # Runtime configuration of the function (see aoc-leaderboard-go/README.md)
          AOC_LEADERBOARD_ID: ${{ vars.AOC_LEADERBOARD_ID || secrets.AOC_LEADERBOARD_ID }}  # variable or secret
          AOC_SESSION: ${{ secrets.AOC_SESSION }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VESTABOARD_API_KEY: ${{ secrets.VESTABOARD_API_KEY }}
          VESTABOARD_FORCE: ${{ vars.VESTABOARD_FORCE }}     # optional: "true" = also post while muted / quiet hours
          VESTABOARD_LEGACY: ${{ vars.VESTABOARD_LEGACY }}   # optional: "true" = old Read/Write API (rw.vestaboard.com)
          TRIGGER_TOKEN: ${{ secrets.AOC_TRIGGER_TOKEN }}
          AOC_YEAR: ${{ github.event.inputs.year || vars.AOC_YEAR }}
          ALWAYS_ACTIVE: ${{ github.event.inputs.always_active == 'true' && 'true' || vars.ALWAYS_ACTIVE }}
        run: |
          # Variables are passed with repeated --env KEY=VALUE flags. (`--env-file` was tried first:
          # the revision never became ready, the app exits at startup when AOC_LEADERBOARD_ID/AOC_SESSION
          # are missing; the same image works with --env.) Empty optional values are left out.
          for v in AOC_LEADERBOARD_ID AOC_SESSION TRIGGER_TOKEN; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
          env_args=()
          for v in AOC_LEADERBOARD_ID AOC_SESSION TRIGGER_TOKEN SLACK_WEBHOOK_URL VESTABOARD_API_KEY VESTABOARD_FORCE VESTABOARD_LEGACY AOC_YEAR ALWAYS_ACTIVE; do
            [ -z "${!v}" ] || env_args+=(--env "$v=${!v}")
          done
          # TRIGGER_TOKEN is the name the app reads; the GitHub secret is AOC_TRIGGER_TOKEN.
          echo "Deploying $IMAGE_REF with variables: $(printf '%s ' "${env_args[@]}" | grep -o -- '--env [A-Z_]*' | cut -d' ' -f2 | tr '\n' ' ')"
          sfn --version

          # `sfn function deploy` only waits ~2 minutes for the revision, but starting it can take longer
          # (the revision still comes up afterwards), so don't let the CLI wait: create the revision,
          # then poll the function until it is Active on a *new* revision (up to 10 minutes).
          describe() { sfn functions describe --no-interactive --no-progress --function-name "$FUNC_NAME" 2>&1; }
          field() { awk -F'│' -v k="$1" '{ key=$1; gsub(/^ +| +$/, "", key); if (key == k) { v=$2; gsub(/^ +| +$/, "", v); print v; exit } }'; }
          before=$(describe | field "Current Revision" || true)

          sfn function deploy \
            --no-interactive --no-progress --no-wait \
            --function-name "$FUNC_NAME" \
            --image "$IMAGE_REF" \
            "${env_args[@]}"

          deadline=$((SECONDS + 600))
          while :; do
            out=$(describe) || out=""
            state=$(field State <<<"$out"); rev=$(field "Current Revision" <<<"$out"); err=$(field Error <<<"$out")
            echo "state=${state:-?} revision=${rev:-?} error=${err:-?}"
            if [ "$state" = "Active" ] && [ -n "$rev" ] && [ "$rev" != "$before" ]; then
              echo "Revision $rev is Active."
              break
            fi
            if [ -n "$err" ] && [ "$err" != "<not set>" ]; then
              echo "::error::function reports an error: $err"; exit 1
            fi
            case "$state" in *ail*|*rror*) echo "::error::function state is '$state'"; exit 1;; esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::revision not Active after 10 minutes (state='${state:-?}', revision='${rev:-?}', previous='${before:-?}')"; exit 1
            fi
            sleep 10
          done

          # final smoke test: the new revision answers
          url=$(field URL <<<"$out")
          if [ -n "$url" ]; then
            curl --fail --silent --show-error --max-time 30 --retry 6 --retry-delay 10 --retry-all-errors "${url%/}/healthz" && echo " <- /healthz"
          fi
